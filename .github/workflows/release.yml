name: Release

# On a version tag (v0.1.0), builds a signed Android App Bundle for Google Play and a signed APK
# for direct download, and attaches both to a GitHub release. F-Droid builds from source itself
# (see docs/releasing.md) and does not use these artifacts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build:android
      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TIDEBOOK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "TIDEBOOK_KEYSTORE_BASE64 is not set" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TIDEBOOK_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed bundle and APK
        working-directory: android
        env:
          TIDEBOOK_KEYSTORE_PASSWORD: ${{ secrets.TIDEBOOK_KEYSTORE_PASSWORD }}
          TIDEBOOK_KEY_ALIAS: ${{ secrets.TIDEBOOK_KEY_ALIAS }}
          TIDEBOOK_KEY_PASSWORD: ${{ secrets.TIDEBOOK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: No network permissions
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2
          permissions=$("$aapt2" dump permissions android/app/build/outputs/apk/release/app-release.apk)
          echo "$permissions"
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)' <<< "$permissions"; then
            echo "The APK requests a network permission." >&2
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab "tidebook-$GITHUB_REF_NAME.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "tidebook-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" --title "Tidebook $GITHUB_REF_NAME" --generate-notes \
            "tidebook-$GITHUB_REF_NAME.aab" "tidebook-$GITHUB_REF_NAME.apk"
