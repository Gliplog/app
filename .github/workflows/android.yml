name: Android

# Builds a debug APK on every change, so the Capacitor project keeps compiling, and fails if
# the APK asks for any network permission. Release signing happens outside CI.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build:android
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - name: No network permissions
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2
          permissions=$("$aapt2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk)
          echo "$permissions"
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)' <<< "$permissions"; then
            echo "The APK requests a network permission." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tidebook-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
