name: F-Droid

# Builds the app the way F-Droid's build server does, from the recipe in docs/fdroid/ with this
# commit in place of the release tag, so a change that would break the F-Droid build fails here
# first. Also runs fdroid lint and rewritemeta on the recipe exactly as it will be submitted.
# docs/releasing.md has the submission steps.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The image fdroiddata's own CI builds merge requests in.
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    env:
      APP_ID: io.github.gliplog
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
      - name: Set up fdroidserver and fdroiddata
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y sudo
          git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git /home/vagrant/fdroidserver
          git clone --depth 1 https://gitlab.com/fdroid/fdroiddata.git fdroiddata
          cp "src/docs/fdroid/$APP_ID.yml" fdroiddata/metadata/
      - name: Lint the recipe
        shell: bash
        working-directory: fdroiddata
        run: |
          set -euxo pipefail
          source /etc/profile.d/bsenv.sh
          export PATH="$fdroidserver:$PATH" PYTHONPATH="$fdroidserver:$fdroidserver/examples"
          export serverwebroot=/tmp
          fdroid lint "$APP_ID"
          fdroid rewritemeta "$APP_ID"
          diff -u "../src/docs/fdroid/$APP_ID.yml" "metadata/$APP_ID.yml"
      - name: Build from this commit
        shell: bash
        working-directory: fdroiddata
        run: |
          set -euxo pipefail
          source /etc/profile.d/bsenv.sh
          sdkmanager "platform-tools" "build-tools;31.0.0"
          git -C "$home_vagrant/gradlew-fdroid" pull
          # The recipe as submitted, pointed at this checkout and commit, versioned from it.
          code=$(python3 -c 'import json; print(json.load(open("../src/package.json"))["versionCode"])')
          name=$(python3 -c 'import json; print(json.load(open("../src/package.json"))["version"])')
          sed -i \
            -e "s|^Repo: .*|Repo: $GITHUB_WORKSPACE/src|" \
            -e "s|^    commit: .*|    commit: $GITHUB_SHA|" \
            -e "s|^  - versionName: .*|  - versionName: $name|" \
            -e "s|^    versionCode: .*|    versionCode: $code|" \
            "metadata/$APP_ID.yml"
          cat "metadata/$APP_ID.yml"
          # fdroidserver can fall back to the recipe's last commit for SOURCE_DATE_EPOCH, as in
          # fdroiddata. Uncommitted, that is empty, and Debian's JDK fails parsing it ("For
          # input string") whenever Gradle writes a properties file.
          git add "metadata/$APP_ID.yml"
          git -c user.name=CI -c user.email=ci@localhost commit -q -m "Test build of $APP_ID"
          chown -R vagrant "$GITHUB_WORKSPACE" "$home_vagrant"
          sudo --preserve-env --user vagrant \
            env PATH="$fdroidserver:$PATH" PYTHONPATH="$fdroidserver:$fdroidserver/examples" \
            PYTHONUNBUFFERED=true HOME="$home_vagrant" serverwebroot=/tmp \
            fdroid build --verbose --test --on-server --no-tarball "$APP_ID:$code"
          ls -l tmp/*.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fdroid-build
          path: |
            fdroiddata/tmp/*.apk
            fdroiddata/logs/
          retention-days: 14
